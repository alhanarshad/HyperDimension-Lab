# HyperDimension Lab website deployment
# Made by Alhan. Copyright 2026 Alhan Arshad.

name: Publish HyperDimension Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check source code
        run: npm run check

      - name: Run geometry tests
        run: npm test

      - name: Prepare public site
        run: |
          mkdir -p site
          cp index.html site/
          cp -R src assets site/
          touch site/.nojekyll

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
